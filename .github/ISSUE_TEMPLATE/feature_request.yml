name: Feature request
description: Suggest an idea for QR Studio
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe the task you want to do, not only the button you imagine.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
