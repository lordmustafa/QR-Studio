name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 / macOS 15 (Apple Silicon) / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QR Studio version
      placeholder: "1.0.0"
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Please use made-up Wi-Fi passwords and contact details.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or file
      description: Drag a screenshot here, or the QR image that does not scan.
